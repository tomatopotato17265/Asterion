name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Run shared Android tests
        run: ./gradlew :shared:testAndroidHostTest

  ios:
    name: iOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run shared iOS simulator tests
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Resolve Swift package dependencies
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -clonedSourcePackagesDirPath .spm-packages \
            | tee resolve-packages.log

      - name: Show resolved package checkouts
        run: |
          echo "--- .spm-packages contents ---"
          find .spm-packages -maxdepth 3 2>&1 || true
          echo "--- Package.resolved ---"
          cat .spm-packages/workspace-state.json 2>&1 || true

      - name: Build iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            -clonedSourcePackagesDirPath .spm-packages \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log
